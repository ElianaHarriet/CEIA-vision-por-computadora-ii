[tool.poetry]
name = "car-damage-detection"
version = "0.1.0"
description = "Sistema de Detección y Evaluación de Daños en Vehículos"
authors = [
    "Santiago Bartolini Rizzo <santiagobartolini@gmail.com>",
    "Luis Ali <aliluis@gmail.com>",
    "Eliana Harriet <eharriet@fi.uba.ar>",
]

[tool.poetry.dependencies]
python = ">=3.11"
ultralytics = "*"
torch = "*"
torchvision = "*"
transformers = "*"
opencv-python = "*"
matplotlib = "*"
seaborn = "*"
pandas = "*"
numpy = "*"
scikit-learn = "*"
roboflow = "*"
jupyter = "*"
ipykernel = "*"
pillow = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
