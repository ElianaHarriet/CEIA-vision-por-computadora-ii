name: Build and push runpod_handler image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para la imagen (además de 'latest')"
        required: false
        default: "latest"
      profile:
        description: "Perfil RunPod a usar (luis o santiago)"
        required: true
        default: "santiago"
        type: choice
        options:
          - luis
          - santiago
  push:
    branches:
      - main
    paths:
      # Estos son exactamente los archivos que runpod_handler/handler.py
      # importa (directa o transitivamente) de airflow/dags/training/ y que
      # por lo tanto terminan corriendo dentro del contenedor. Si el handler
      # empieza a importar un archivo nuevo de esa carpeta, agregarlo acá a
      # mano o el cambio no va a disparar un build.
      - "runpod_handler/**"
      - "airflow/dags/training/config.py"
      - "airflow/dags/training/mlflow_manager.py"
      - "airflow/dags/training/yolo_trainer.py"
      - "airflow/dags/training/unet_trainer.py"
      - "airflow/dags/training/dataloader_factory.py"
      - "airflow/dags/training/datasets.py"
      - ".github/workflows/build-runpod-handler.yml"

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar variables según el usuario
        run: |
          # Leer el perfil desde airflow/config/.runpod-profile (versionado en git)
          if [ -f "airflow/config/.runpod-profile" ]; then
            PROFILE=$(grep "^RUNPOD_PROFILE=" airflow/config/.runpod-profile | cut -d'=' -f2 | tr -d ' ')
            echo "🎯 Perfil leído desde airflow/config/.runpod-profile: $PROFILE"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Fallback: input manual si se ejecuta manualmente
            PROFILE="${{ github.event.inputs.profile }}"
            echo "🎯 Perfil seleccionado manualmente: $PROFILE"
          else
            # Fallback: detección por github.actor
            if [ "${{ github.actor }}" = "LuisAli22" ]; then
              PROFILE="luis"
            else
              PROFILE="santiago"
            fi
            echo "🤖 Perfil auto-detectado por actor: $PROFILE (actor: ${{ github.actor }})"
          fi
          
          # Configurar variables según el perfil
          if [ "$PROFILE" = "luis" ]; then
            echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME_LUIS }}" >> $GITHUB_ENV
            echo "DOCKER_TOKEN=${{ secrets.DOCKERHUB_TOKEN_LUIS }}" >> $GITHUB_ENV
            echo "RUNPOD_ENDPOINT_ID=${{ vars.RUNPOD_ENDPOINT_ID_LUIS }}" >> $GITHUB_ENV
            echo "RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY_LUIS }}" >> $GITHUB_ENV
            echo "✓ Usando credentials de Luis (Docker Hub: lali22)"
          else
            echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV
            echo "DOCKER_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}" >> $GITHUB_ENV
            echo "RUNPOD_ENDPOINT_ID=${{ vars.RUNPOD_ENDPOINT_ID }}" >> $GITHUB_ENV
            echo "RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }}" >> $GITHUB_ENV
            echo "✓ Usando credentials de Santiago"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          df -h /

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          # Tag with the commit SHA in addition to `latest`: RunPod workers
          # cache the image locally by tag and don't reliably re-pull `latest`
          # on every job, so a SHA-pinned tag is the only way to guarantee a
          # worker actually runs the code from this build.
          docker buildx build \
            --platform linux/amd64 \
            --file runpod_handler/Dockerfile \
            --tag ${{ env.DOCKER_USERNAME }}/runpod-training-handler:latest \
            --tag ${{ env.DOCKER_USERNAME }}/runpod-training-handler:${{ github.sha }} \
            --push \
            .

      # Repunta el Container Image del template del endpoint al SHA recién
      # pusheado, vía la GraphQL API de RunPod - reemplaza el paso manual de
      # "actualizar el Container Image en la consola". IMPORTANTE: antes de
      # confiar en este step, probar update_runpod_image.py a mano (dry-run
      # y luego --apply) contra el endpoint real desde una terminal - ver
      # .github/workflows/scripts/update_runpod_image.py.
      - name: Point RunPod endpoint at the new image
        env:
          RUNPOD_API_KEY: ${{ env.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ env.RUNPOD_ENDPOINT_ID }}
        run: |
          python3 .github/workflows/scripts/update_runpod_image.py \
            "${{ env.DOCKER_USERNAME }}/runpod-training-handler:${{ github.sha }}" \
            --apply